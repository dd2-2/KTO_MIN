<title>관광e배움터_카테고리별 정리</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#151515;
  --surface:#1D1D1D;
  --surface-2:#232323;
  --border:#323232;
  --text:#ECECEC;
  --text-muted:#9A9A9A;
  --accent:#6E9CF5;
  --accent-ink:#0E1116;
  --accent-bg:#1B2436;
  --gold:#E3A15C;
  --gold-bg:#2E2418;
  --slate:#A3A3A3;
  --slate-bg:#242424;
  --mono: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
  --sans: 'Pretendard Variable','Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.6);
}
:root[data-theme="light"]{
  --bg:#F5F5F5;
  --surface:#FFFFFF;
  --surface-2:#EFEFEF;
  --border:#DCDCDC;
  --text:#1A1A1A;
  --text-muted:#68686B;
  --accent:#3358CF;
  --accent-ink:#FFFFFF;
  --accent-bg:#E6EBFB;
  --gold:#A8662A;
  --gold-bg:#FBEEDE;
  --slate:#5C5C5F;
  --slate-bg:#ECECED;
  --shadow: 0 1px 2px rgba(20,20,20,0.06), 0 12px 32px -16px rgba(20,20,20,0.14);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

/* ---- 헤더 ---- */
header{
  flex:0 0 auto;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  padding:8px 20px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
}
.brand{display:flex; align-items:baseline; justify-content:flex-start; gap:7px; white-space:nowrap;}
.brand .org{
  font-size:17px;
  font-weight:800;
  letter-spacing:-0.01em;
  color:var(--text);
}
.brand .svc{
  font-size:12px;
  font-weight:600;
  color:var(--accent);
  letter-spacing:0.02em;
}
.head-stats{
  display:flex;
  align-items:center;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
}
.hstat{
  display:flex;
  align-items:baseline;
  gap:5px;
  padding:6px 13px;
  font-size:11.5px;
  color:var(--text-muted);
  border-left:1px solid var(--border);
  white-space:nowrap;
}
.hstat:first-child{border-left:none;}
.hstat b{font-family:var(--mono); font-size:14.5px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums;}
.hstat b.c-open{color:var(--accent);}
.hstat b.c-job{color:var(--slate);}
.hstat b.c-custom{color:var(--gold);}
.head-right{display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
#themeBtn, #summaryBtn, #shareBtn{
  font-family:var(--sans);
  font-size:12.5px;
  font-weight:600;
  color:var(--text);
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:7px 11px;
  border-radius:7px;
  cursor:pointer;
  white-space:nowrap;
}
#themeBtn:hover, #summaryBtn:hover, #shareBtn:hover{border-color:var(--accent);}
#shareFallback{
  margin-left:6px;
  font-size:11.5px;
  font-family:var(--mono);
  width:170px;
  padding:6px 8px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  display:none;
}
#dlBtn{
  font-family:var(--sans);
  font-size:12.5px;
  font-weight:700;
  color:var(--accent-ink);
  background:var(--accent);
  border:none;
  padding:7px 14px;
  border-radius:7px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  transition:filter .15s ease, transform .15s ease;
}
#dlBtn:hover{filter:brightness(1.1);}
#dlBtn:active{transform:translateY(1px);}
#dlBtn:focus-visible, #themeBtn:focus-visible, #summaryBtn:focus-visible, #shareBtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---- 필터 바 ---- */
.filterbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 20px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  flex-wrap:wrap;
}
#search{
  flex:1 1 260px;
  min-width:200px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--sans);
  font-size:13.5px;
  padding:7px 12px;
  border-radius:7px;
}
#search:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
select{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--sans);
  font-size:13px;
  padding:7px 9px;
  border-radius:7px;
}
select:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
#resultCount{
  font-family:var(--mono);
  font-size:12.5px;
  color:var(--text-muted);
  white-space:nowrap;
}
#resultCount b{color:var(--text); font-weight:700;}

/* ---- 인기 태그 칩 ---- */
.tagbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px 20px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  flex-wrap:wrap;
}
.tagbar .label{font-size:11px; color:var(--text-muted); margin-right:2px; flex:0 0 auto;}
.tagchip{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-muted);
  background:var(--surface);
  border:1px solid var(--border);
  padding:3px 9px;
  border-radius:99px;
  cursor:pointer;
  white-space:nowrap;
}
.tagchip:hover{border-color:var(--accent); color:var(--text);}
.tagchip.active{background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:700;}

/* ---- 목록 ---- */
main{flex:1 1 auto; overflow-y:auto; padding:2px 20px 16px;}
.row{
  border-bottom:1px solid var(--border);
  padding:7px 4px;
  cursor:pointer;
}
.row:hover{background:var(--surface);}
.row-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.chip{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.03em;
  padding:2px 8px;
  border-radius:99px;
  flex:0 0 auto;
}
.chip.공개강좌{background:var(--accent-bg); color:var(--accent);}
.chip.직무강좌{background:var(--slate-bg); color:var(--slate);}
.chip.맞춤강좌{background:var(--gold-bg); color:var(--gold);}
.row-minor{font-size:12px; color:var(--text-muted);}
.row-sub{font-size:11.5px; color:var(--text-muted); font-family:var(--mono);}
.row-title{font-size:15px; font-weight:600; margin-top:4px;}
.row-tags{font-size:11.5px; color:var(--text-muted); margin-top:4px; font-family:var(--mono);}
.row-detail{
  display:none;
  margin-top:9px;
  padding:11px 13px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:13px;
  line-height:1.6;
}
.row.open .row-detail{display:block;}
.row-detail .f{margin-bottom:8px;}
.row-detail .f:last-child{margin-bottom:0;}
.row-detail .k{color:var(--accent); font-weight:700; font-size:11.5px; letter-spacing:0.03em; margin-bottom:2px;}
.row-detail .v{color:var(--text);}
.row-detail a{color:var(--accent);}
#empty{display:none; text-align:center; padding:60px 20px; color:var(--text-muted); font-size:14px;}

/* ---- 요약 대시보드 ---- */
#summary{
  flex:0 0 auto;
  display:none;
  padding:8px 20px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
#summary.open{display:block;}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--border);
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}
.stat{background:var(--surface-2); padding:7px 12px; display:flex; align-items:baseline; gap:7px;}
.stat .n{font-family:var(--mono); font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;}
.stat .l{font-size:11px; color:var(--text-muted);}
.stat.공개강좌 .n{color:var(--accent);}
.stat.직무강좌 .n{color:var(--slate);}
.stat.맞춤강좌 .n{color:var(--gold);}
.chart-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; align-items:start; margin-top:8px;}
.chart-card h3{margin:0 0 8px; font-size:12px; font-weight:700; color:var(--text-muted); letter-spacing:0.02em; text-transform:uppercase;}
.barlist{display:flex; flex-direction:column; gap:5px;}
.barrow{display:grid; grid-template-columns:104px 1fr 40px; align-items:center; gap:8px;}
.barrow-label{font-size:11.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.barrow-track{height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
.barrow-fill{height:100%; background:var(--accent); border-radius:5px; min-width:3px;}
.barrow-value{font-family:var(--mono); font-size:11.5px; color:var(--text); text-align:right; font-variant-numeric:tabular-nums;}
#summaryBtn.active{border-color:var(--accent); color:var(--accent);}

/* ---- 모바일 대응 ---- */
@media (max-width: 720px){
  /* 헤더+필터+태그바가 쌓이면 100vh를 넘어 정작 목록(main)이 안 보이던 문제 —
     모바일에서는 앱 셸(내부 스크롤) 대신 페이지 전체가 자연스럽게 스크롤되게 전환 */
  body{height:auto; min-height:100vh; overflow:visible;}
  main{overflow-y:visible;}

  header{
    grid-template-columns:1fr;
    grid-template-areas:"brand" "stats" "actions";
    gap:6px;
    padding:6px 12px;
  }
  .brand{grid-area:brand; justify-content:center; gap:5px;}
  .brand .org{font-size:14px;}
  .brand .svc{font-size:10.5px;}
  .head-stats{grid-area:stats; width:100%; flex-wrap:wrap;}
  .hstat{flex:1 1 auto; justify-content:center; padding:4px 8px; font-size:10.5px;}
  .hstat b{font-size:12.5px;}
  .head-right{grid-area:actions; width:100%; justify-content:center; gap:6px;}
  #themeBtn, #summaryBtn, #shareBtn, #dlBtn{font-size:11px; padding:5px 9px;}
  .filterbar{padding:5px 12px; gap:5px;}
  #search{flex:1 1 100%; padding:6px 10px; font-size:12.5px;}
  select{flex:1 1 auto; padding:6px 8px; font-size:12px;}
  #resultCount{font-size:11px;}
  /* 태그 칩이 줄바꿈되면 화면을 다 잡아먹어서 한 줄 가로 스크롤로 전환 */
  .tagbar{padding:5px 12px; gap:4px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .tagbar .label{flex:0 0 auto; font-size:10px;}
  .tagchip{flex:0 0 auto; font-size:10px; padding:3px 8px;}
  main{padding:2px 12px 14px;}
  .row{padding:6px 2px;}
  .row-title{font-size:14px;}
  #summary{padding:6px 12px;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .barrow{grid-template-columns:76px 1fr 34px;}
}
</style>

<div class="filterbar">

자를 비롯한 참가 예정 학생 3. 안전여행 및 여행에티켓에 관심있는 학습자","o":"교통수단별 안전한 이용방법을 이해한다. 해외여행 체크리스트와 비상상황별 대처방법을 학습할 수 있다. 여행활동별 안전여행을 위한 중요사항을 학습할 수 있다. 여행동선별 안전사고를 유발하는 행위를 미리 알아보고 실제 여행에서 안전사고를 예방할 수 있다.","d":"버스, 자동차, 기차 여행시 안전사고 예방을 위한 꿀팁을 알려드립니다! 많은 인원이 함께 여행하는 단체여행/수학여행은 참가자 개개인의 안전수칙 준수가 중요합니다. 영상을 보면서 미리 생각해보면 어떨까요? 여행목적지별 예기치 않은 안전사고를 사례중심으로 소개합니다.","u":"https://touredu.visitkorea.or.kr/home/openEdu/selectOpenEduInfo?crsCd=C190000080"},{"a":"공개강좌","b":"공통/소양","s":"업무스킬","t":"사무관리란 무엇일까?","g":["공통","문서관리","소양","업무스킬","총무"],"h":"","r":"회사의 총무 분야에 관심있는 학습자","o":"경영사무원으로서의 업무를 설명할 수 있다. 총무사무(사무관리/인사노무) 영역의 경영사무 실무를 이해하고 실제 업무에 적용시켜 활용할 수 있다. 우수 사례를 통해 습득한 업무 해결 노하우를 자신의 업무에 적용시킬 수 있다. 다양한 역량 학습을 통해 전문 인력으로써의 경영사무원의 역할을 수행할 수 있다.","d":"경영사무원에게 필요한 다양한 기본 역량과 업무에 즉각적으로 활용할 수 있는 구체적인 방법을 제공하는 과정으로 총무 사무에 대한 내용을 포함하고 있습니다. 총무 사무는 크게 사무관리와 인사 노무로 나누어지는데, 본 과정에서는 이 내용을 함께 제공하고 있습니다. 또한 경영사무원이 사무관리 및 인사노무 업무에서 직면하는 다양한 사례를 바탕으로 학습내용을 구성하여 학습한 내용을 실제 업무에서 바로 활용할 수 있도록 하였습니다. 강사 : 지 민","u":"https://touredu.visitkorea.or.kr/home/openEdu/selectOpenEduInfo?crsCd=C190000078"},{"a":"공개강좌","b":"공통/소양","s":"업무스킬","t":"절세의 출발은 정확한 세금신고부터 시작한다.","g":["경리","공통","세무","소양","업무스킬","회계"],"h":"","r":"회사의 회계/세무 분야에 관심있는 모든 분","o":"경영사무원으로서의 업무를 설명할 수 있다. 경리사무 영역의 경영사무 실무를 이해하고 실제 업무에 적용시켜 활용할 수 있다. 우수 사례를 통해 습득한 업무 해결 노하우를 자신의 업무에 적용시킬 수 있다. 다양한 역량 학습을 통해 전문 인력으로써의 경영사무원의 역할을 수행할 수 있다.","d":"경영사무원에게 필요한 다양한 기본 역량과 업무에 즉각적으로 활용할 수 있는 구체적인 방법을 제공하는 과정으로 경리 사무에 대한 내용을 포함하고 있습니다. 경영사무원이 업무에서 직면하는 다양한 사례를 바탕으로 학습내용을 구성하여, 학습한 내용을 업무에서 활용할 수 있도록 하였습니다. 특히 복잡한 세금신고 기간이나 세금계산서 처리, 매입세액공제와 불공제, 원천징수 관련 업무 등을 일목요연하게 정리하여 실무에 큰 도움이 되도록 하였습니다. 강사 : 진성규","u":"https://touredu.visitkorea.or.kr/home/openEdu/selectOpenEduInfo?crsCd=C190000077"},{"a":"공개강좌","b":"공통/소양","s":"공통소양","t":"출근하기 위해 미리 준비해야 할 것","g":["공통","공통소양","대인관계","비즈니스매너","소양","직장생활","커뮤니케이션"],"h":"","r":"사회생활 초년생 및 재취업자","o":"회사에서 지켜야 할 기본 매너를 설명할 수 있다. 조직문화를 공감하고 회사 생활에 적용할 수 있다. 커뮤니케이션 스킬을 회사 생활에 적용할 수 있다. 회사 내에서 발생할 수 있는 갈등 상황에 대처할 수 있다. 남성과 여성, 다양한 연령 등 회사 구성원들과의 관계를 설정할 수 있다.","d":"회사생활에서 지켜야 할 비즈니스 매너와 대인관계 형성 및 자기관리를 위해 필요한 역량을 학습하는 과정으로, 기본적인 비즈니스 예절부터 보고, 대화, 인맥관리, 갈등해결, 멘토 설정, 목표 설정 방법과 같은 내용을 자세히 학습할 수 있습니다. 특히, 사회생활 초년생 및 재취업자, 워킹맘들이 실제로 가질 수 있는 궁금증 및 키워드를 바탕으로 학습을 진행하며, 이러한 궁금증을 학습을 통해 해결할 수 있습니다. 또한, 실제 회사 생활의 고민에 대해 전문가가 노하우를 제공해주는 ‘회사 적응 해결 백서‘, ‘워킹맘 적응 노트’ 등을 통해 회사생활 현장에 대해 더 자세히 알아볼 수 있습니다. 강사 : 심소연","u":"https://touredu.visitkorea.or.kr/home/openEdu/selectOpenEduInfo?crsCd=C190000076"},{"a":"공개강좌","b":"공통/소양","s":"공통소양","t":"관광산업현황 및 관광정책 이해 Ⅰ : 한국관광의 경쟁력, 관광객 트렌트 변화","g":["공통","공통소양","관광산업","관광적책","관광학","소양"],"h":"","r":"전반적 관광산업 및 관광정책에 대해 파악하고 싶은 모든 학습자","o":"한국 관광정책의 의의, 관광산업 현황을 이해할 수 있다. 문화, 교통, IT 등 다양한 산업과의 융합형 관광산업과 정책을 이해할 수 있다.","d":"본 과정을 통해 한국관광의 경쟁력과 관광객의 트랜드와 변화를 이해하고 한국 관광 활성화하여 더 나은 서비스를 제공할 수 있게 됩니다. 아울러, 관광정책의 변화를 이해하여 새로운 경제활성화의 모멘텀을 이끌 수 있으며 다양한 관광 추진전략과 관광정책을 앎으로써 관광의 각 분야에서의 협력과 육성에 기여할 수 있습니다. 강사 : 김재호 교수(인하공업전문대학 관광경영과)","u":"https://touredu.visitkorea.or.kr/home/openEdu/selectOpenEduInfo?crsCd=C190000065"},{"a":"공개강좌","b":"공통/소양","s":"업무스킬","t":"UX 디자인 실무과정 알아보기","g":["UI","UX","공통","디자인","디지털활용","소양","업무스킬"],"h":"","r":"1. 모바일 UX/UI 디자인 분야로 취업하고 싶은 취업 준비생 2. 모바일 UX/UI 디자인 분야로 재취업하고 싶은 경력자(기존 웹디자이너 및 디자인 관련 직무 경력 보유자) 3. 모바일 UX/UI 디자인 분야로 창업하고 싶은 예비 창업자","o":"모바일 앱/웹 및 OS별 디자인 특징을 고려해 UX/UI를 기획하고 설계할 수 있다. 모바일 UX/UI 실무 프로젝트 수행 및 포트폴리오를 제작할 수 있다. 모바일 UX/UI 디자이너가 알아야할 코딩 용어와 개념을 말할 수 있다. 실무에서 처리하는 프로세스에 맞춰, 모바일 앱/웹 UX/UI 디자인 작업을 직접 수행할 수 있다.","d":"모바일 UX/UI 디자이너는 단지 UI를 아름답게 꾸미는 것이 아니라, 실제 모바일 앱/웹 개발에 있어 기획자와 개발자의 소통과정에 전반적으로 참여해 의견을 수렴하고 반영하는 등 기획과 개발 과정 전반을 설계(디자인) 해야 합니다. 그만큼 관련 지식과 실무역량은 물론, 열린 태도를 갖추는 것이 중요합니다. 본 과정은 모바일 앱 디자인 실무와 포트폴리오 제작 뿐만 아니라, 모바일 UX/UI 디자이너가 알아야 할 기획 코딩 실무에 대한 내용도 함께 다루고 있습니다. UX/UI 디자인 방법론, 페이퍼 프로토타입을 활용한 앱 기획 및 설계, 각 운영체제 별 디자인 가이드 제작 방법, 이미지 해상도 변환, 테마별 앱 디자인, 인터랙션 디자인 등의 필수 실무 내용과 함께 HTML, CSS를 활용한 앱 퍼블리싱까지 학습하여 모바일 UX/UI 디자이너가 갖춰야 할 다양한 실무 지식과 기술을 습득할 수 있는 기회를 제공합니다.","u":"https://touredu.visitkorea.or.kr/home/openEdu/selectOpenEduInfo?crsCd ":"프리랜서 MICE인의 실제 진입 경로와 필요 역량을 사례 중심으로 이해할 수 있다. 유연한 업무 환경과 글로벌 네트워크의 특징을 통해 프리랜서 MICE의 매력을 설명할 수 있다. 프리랜서 경로가 직장인에서 기업가로의 성장 기회가 될 수 있음을 인식할 수 있다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 7개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 이 강좌는 프리랜서 MICE인의 삶을 중심으로, 조직 소속이 아닌 독립적 전문가로서의 MICE 커리어 경로와 실질적 매력을 조명합니다. 전통적인 직장 문화에서 벗어나 자율성과 유연성을 기반으로 일하는 프리랜서 MICE인의 사례를 통해, 진입 과정, 실무 요건, 네트워크 구축 방법 등 실전 정보를 제공합니다. 특히, 실제 경험을 바탕으로 프리랜서의 도전 요인과 보람, 글로벌 네트워크 확장 방식, 기업가로의 성장 가능성까지 포괄적으로 소개되어, 비정형적 커리어를 꿈꾸는 학습자에게 현실적인 통찰을 제공합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500640&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0100"},{"a":"직무강좌","b":"벤처/관광기업","s":"전략/기획","t":"비전공자에서 글로벌 MICE 기획자로! - 스타 대표님의 성장 스토리","g":["ICT융합MICE","MICE,","MICE성장전략","MICE진로스토리","관광기업","관광업/관광산업","관광학","국제회의기획자","글로벌MICE기획자","기획","도전과선택","무경력도전","벤처","업무스킬","워킹맘성공사례","전략","창업","커리어전환","하이브리드행사"],"h":"한신자(이즈피엠피 대표)","r":"MICE 산업 예비종사자 및 관련 직무 신입사원","o":"MICE 진입 장벽을 극복한 실전 사례를 통해 진로 선택의 다양한 경로를 이해할 수 있다. MICE 산업에서 필요한 실무 능력과 성장 역량의 본질을 파악할 수 있다. 변화에 유연하게 대응하며 커리어를 확장하는 전략을 습득할 수 있다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 7개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 이 강좌는 30대 중반, 무경력의 워킹맘이 국내 최초 국제회의 전공 대학원 입학부터 글로벌 MICE 기획사 공동대표로 성장하기까지의 실제 사례를 중심으로 구성된 인터뷰형 콘텐츠입니다. 학력, 경력, 성격 등 다양한 제약 조건을 뛰어넘어 MICE 산업에 도전하고 생존해온 과정을 3번의 ‘선택’이라는 서사로 풀어내며, 불확실한 시대 속에서도 꾸준한 성찰과 실행으로 변화의 흐름을 선도한 인물의 생생한 이야기를 통해 학습자에게 도전과 지속 성장의 메시지를 전달합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500639&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0100"},{"a":"직무강좌","b":"벤처/관광기업","s":"전략/기획","t":"MICE 오해와 진실(3) - 영어만 잘하면 된다?","g":["MICE,","MICE영어오해","MICE직무역량","관광기업","관광업/관광산업","관광학","글로벌커뮤니케이션","기획","논리적소통","문화감수성","벤처","성장형태도","소통전문가","언어보다맥락","업무스킬","영어울렁증극복","전략","전문성기반소통"],"h":"김지윤(닷플래너 대표)","r":"MICE 산업 예비종사자 및 관련 직무 신입사원","o":"MICE 산업에 대한 ‘영어 만능주의’ 오해를 논리와 사례로 설명할 수 있다. 글로벌 소통에 필요한 핵심 역량(전문성, 문화 감수성, 논리력)을 설명할 수 있다. 영어 실력 습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 이 강좌는 MICE 산업에 대한 대표적 오해 중 하나인 ‘과도한 야근’과 ‘대형 행사 위주’의 인식을 바로잡기 위해, 실제 업무 주기와 현장 경험을 바탕으로 진실을 전달하는 토크쇼 형식의 콘텐츠입니다. MICE 업무는 상시 야근이 아닌 주기적 몰입 구조를 가지고 있으며, 행사 규모와 조직 형태에 따라 근무 강도도 다양합니다. 해당 차시는 ‘야근이 일상이다’라는 편견을 해소하고, 밀도 높은 업무 몰입과 워라밸의 균형을 갖춘 MICE 실무의 실제 모습을 학습자가 쉽게 이해할 수 있도록 구성되었습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500636&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0100"},{"a":"직무강좌","b":"벤처/관광기업","s":"전략/기획","t":"신입 인턴의 하루, MICE 행사 따라잡기!","g":["MICE,","MICE실무","MICE운영과정","결과보고서","관광기업","관광업/관광산업","관광콘텐츠","관광학","기획","베뉴선정","벤처","업무스킬","연사섭외","위기관리","전략","지속가능관광포럼","지역관광","포럼운영","행사기획","현장운영"],"h":"김지윤(닷플래너 대표)","r":"MICE 산업 예비종사자 및 관련 직무 신입사원","o":"MICE 행사의 기획부터 실행, 결과보고까지의 전체 흐름을 단계별로 이해할 수 있다. 행사 운영에 필요한 핵심 실무(기획안, 예산, 베뉴선정, 연사관리 등)의 절차를 설명할 수 있다. 다양한 돌발 상황에 유연하게 대응할 수 있는 실무 역량을 함양할 수 있다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 7개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 이 강좌는 신입 인턴의 하루를 따라가며 실제 MICE 행사 운영 과정을 생생하게 체험하도록 구성된 브이로그 형식의 실전 콘텐츠입니다. ‘2025 글로벌 지속가능관광 포럼’을 가상의 사례로, 기획→운영→결과관리의 전 과정을 단계별로 안내하고, 기획서 작성, 베뉴 선정, 연사 섭외, 현장 운영, 위기관리, 결과보고서 작성까지 실제 행사 담당자의 업무 전반을 쉽게 따라 할 수 있도록 구성하였습니다. 현장감 있는 묘사를 통해 초보자도 MICE 업무를 이해하고 실무에 대비할 수 있도록 돕습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500635&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0100"},{"a":"직무강좌","b":"벤처/관광기업","s":"전략/기획","t":"우리 일상 속 MICE 알아보기","g":["MICE,","MICE산업","MICE시민참여","관광기업","관광업/관광산업","관광콘텐츠","관광학","글로벌MICE사례","기획","도시성장엔진","문명의플랫폼","미래직무탐색","벤처","생활형혁신산업","일상속MICE","전략","지역관광","컨벤션클러스터","회의포상관광전시"],"h":"허준(동덕여자대학교 교수)","r":"MICE 산업 예비종사자 및 관련 직무 신입사원","o":"MICE의 구성 요소(Meeting, Incentive, Convention, Exhibition)와 산업적 의미를 이해할 수 있다. MICE가 시민의 일상, 도시 성장, 사회문화적 변화에 미치는 영향을 설명할 수 있다. 다양한 글로벌 및 국내 사례를 통해 MICE의 실생활 활용 사례를 분석하고 공유할 수 있다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 7개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 이 강좌는 일상에서 이미 경험하고 있는 MI  콘텐츠 담당자, 예비 창업자 등","o":"웰니스 관광의 개념과 핵심 가치를 이해한다. 국내외 웰니스 관광의 주요 사례와 성장 배경을 파악한다. 지속가능성·지역성·융합성 관점에서 웰니스 관광의 미래 방향을 탐색한다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 4개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 여행은 이제 단순한 휴식이 아닌, 몸과 마음의 균형을 되찾는 ‘치유의 여정’으로 진화하고 있습니다. 이 강의에서는 웰니스 관광의 개념과 산업적 흐름을 이해하고, 국내외 대표 사례를 통해 웰니스 관광이 왜 주목받는지 살펴봅니다. 또한 사회·경제·기술 변화 속에서 웰니스 관광이 어떻게 성장하고 있는지, 앞으로 어떤 방향으로 발전할지를 함께 탐색합니다. [투어리즘 커리어 마일리지 특별수료증 발급 안내] * TCM(투어리즘 커리어 마일리지)란? 관광일자리센터 취업 프로그램 및 관광e-배움터 직무별 패키지 과정 수료자 대상 특별 수료증을 제공하는 과정입니다. 발급대상 : 본 패키지 과정 수강 완료 후, 관광일자리센터 취업프로그램을 일정 기준 이상 수료한 교육생 혜택 : 기준 충족 시 한국관광공사 사장 명의의 특별수료증 추가 발급, 관광인 구인등록 기업 우선 추천, 관광일자리센터 프로그램 참여 기회 우선 제공, 우수 참여자 대상 시상 세부내용 : 이벤트 페이지 참조 (하이퍼링크)","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500482&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0200"},{"a":"직무강좌","b":"관광콘텐츠/인프라","s":"전략/기획","t":"글로벌 시장을 잇는 통합 전략","g":["FIT","K컬처","관광업/관광산업","관광인프라","관광콘텐츠","관광통계","글로벌시장","기획","대만홍콩","동남아시장","디지털기술","디지털혁신","디지털활용","마케팅","미주시장","시장다변화","여행업","유럽관광","인바운드관광","자유여행","전략","지역관광","트렌드","팬덤관광","한국문화"],"h":"민경찬(하나투어ITC)","r":"로컬관광 업무 관련 실무자 및 예비종사자, 창업준비자","o":"한국 인바운드 시장의 구조적 변화와 현황을 종합적으로 이해할 수 있다. K-컬처 의존, 여행 편의성 부족, 수도권 집중 등 당면 과제를 진단하고 분석할 수 있다. 콘텐츠·기술·지역 융합 전략을 바탕으로 질적 성장 기반의 관광 전략을 수립할 수 있다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 4개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 본 강좌는 전 세계적 관심 속에 급성장하는 한국 인바운드 관광시장을 지속 가능하고 질적으로 성장시키기 위한 통합 전략을 다룹니다. K-컬처 팬덤 중심의 외국인 관광 수요 확산과 함께 발생하는 구조적 문제를 짚고, 이를 해결하기 위한 콘텐츠, 기술, 지역 융합 전략을 제시합니다. 단순 유행을 넘어 K-라이프스타일 전반을 관광 자원으로 확대하고, 서울 중심에서 벗어나 전국으로 관광 동선을 확장하는 실질적 방안을 학습할 수 있습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500454&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0200"},{"a":"직무강좌","b":"관광콘텐츠/인프라","s":"전략/기획","t":"글로벌 인바운드 시장 개관","g":["FIT","K컬처","관광업/관광산업","관광인프라","관광콘텐츠","관광통계","글로벌시장","기획","대만홍콩","동남아시장","디지털활용","마케팅","미주시장","시장다변화","여행업","유럽관광","인바운드","인바운드관광","자유여행","전략 한 여행을 즐길 수 있습니다. 본 과정은 열린관광을 위해 관광취약계층에게 제공해야 할 적절한 관광 서비스의 실무 매뉴얼을 대상별, 상황별로 정리하여 쉽고 재미있게 구성하였습니다. 본 과정을 학습하는 여러분 덕분에 대한민국의 모든 관광지는 열린관광지로 거듭날 것입니다. ※알림※ ☞ 강의 내용 중 수정/보완 내용을 해당 과정 공지란에 게시하였으니 학습시 꼭 확인부탁드립니다. ☞ 공지 보는 방법 : 수강신청 > 나의강의실 > 나의학습과정 > 과정 선택 후 공지 탭 클릭 *학습자료(열린관광을 위한 서비스제공 매뉴얼, 2021)은 수강신청 후 '나의강의실>자료실'에서 다운 받으실 수 있습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000099&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0200"},{"a":"직무강좌","b":"관광콘텐츠/인프라","s":"공사사업","t":"방역수칙 준수로 안전한 관광지 만들기(관광지 종사자 방역 교육)","g":["공사사업","관광인프라","관광지","관광콘텐츠","방역수칙","안전관광"],"h":"","r":"관광지 종사자 (방역관리자 및 일반운영자)","o":"관광지에서 지켜야 할 7대 방역수칙이 무엇인지 알 수 있다. 세부 방역수칙을 어떻게 실천해야 하는지 알 수 있다.","d":"관광지 종사자 대상 관광지에서 준수해야 할 7대 방역수칙과 안전한 관광지를 만드는 방역에 대한 교육입니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000096&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0200"},{"a":"직무강좌","b":"관광콘텐츠/인프라","s":"공사사업","t":"관광(단)지 민간투자유치","g":["공사사업","관광개발","관광단지","관광인프라","관광콘텐츠","투자유치"],"h":"정란수(프로젝트 수 대표, 한양대학교 겸임 교수)","r":"지역관광개발 및 투자유치 담당 지자체 공무원.","o":"민간투자유치와 관광트렌드의 관계를 이해한다. 민간투자유치를 위한 관광트렌드의 적용을 고려한다. 포스트 코로나 시대, 관광트렌드의 변화를 이해한다. 관광 민간투자유치의 개념과 일반적인 투자유치와의 차이를 이해한다. 관광 민간투자유치의 전반적인 절차, 홍보마케팅 방법, 공모제안서 작성방법을 이해한다.","d":"지자체 관광개발 담당자를 위한 관광(단)지 민간투자유치 실무교육.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000094&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0200"},{"a":"직무강좌","b":"관광콘텐츠/인프라","s":"공사사업","t":"관광지의 이해 및 기획","g":["공사사업","관광개발","관광단지","관광인프라","관광지","관광콘텐츠"],"h":"김재호 교수(인하공업전문대학교)","r":"지역관광개발 및 투자유치 담당 지자체 공무원","o":"관광지 및 관광단지의 개념 및 차이를 이해할 수 있다. 관광지 및 관광단지의 지정 이유 및 특성을 이해할 수 있다. 관광지 및 관광단지의 제도 변화를 이해할 수 있다. 관광지 및 관광단지의 리스크 유형 및 극복방법을 이해할 수 있다. 관광지 및 관광단지의 사전계획의 의의와 필요성, 주요 검토사항을 이해할 수 있다. 지역 관광자원 개발의 성공 키워드를 이해할 수 있다.","d":"지자체 관광개발 담당자를 위한 관광지의 이해 및 기획 실무교육.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000093&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J 를 통해 \"잘 꾸며진 남의 집\"이 아닌, 예약률로 이어지는 나만의 숙소 스타일을 만들 수 있도록 돕습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500536&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"고객 응대의 중심, 프론트오피스 직무","g":["객실예약관리","객실운영이해","고객관리","관광업/관광산업","관광인프라","벨데스크역할","서비스","숙박","숙박업실무","체크인체크아웃","컨시어지서비스","프론트오피스직무","프론트직원역량","호텔/숙박업","호텔고객응대","호텔보안업무","호텔서비스운영","호텔업","호텔직무이해"],"h":"성미연(JW메리어트동대문스퀘어서울 식음 부장)","r":"호텔/숙박업 관련 업무 실무자 및 신입사원, 예비종사자","o":"프론트오피스의 역할과 호텔 객실 상품의 특성을 이해하고 설명할 수 있다. 객실부 조직 내 프론트오피스 관련 직무의 세부 기능과 업무를 구체적으로 이해할 수 있다. 고객 응대를 위한 프론트오피스 직원의 핵심 역량을 실무 중심으로 설명할 수 있다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 5개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 이 강좌는 호텔 고객 응대의 최전선에 있는 프론트오피스 직무의 구성과 업무 흐름, 그리고 필수 역량을 종합적으로 다룹니다. 프론트오피스는 체크인·체크아웃, 예약관리, 고객 응대 등 투숙객 경험의 시작과 끝을 책임지는 핵심 부서로, 객실부서 조직 내 역할과 업무를 체계적으로 이해하는 것이 중요합니다. 본 과정에서는 프론트 데스크, 컨시어지, 벨 데스크, 전화교환원, 보안 등 세부 직무별 역할과 함께, 호텔 객실 상품의 특성과 서비스 운영의 실무 내용을 사례와 함께 학습합니다. [투어리즘 커리어 마일리지 특별수료증 발급 안내] * TCM(투어리즘 커리어 마일리지)란? 관광일자리센터 취업 프로그램 및 관광e-배움터 직무별 패키지 과정 수료자 대상 특별 수료증을 제공하는 과정입니다. 발급대상 : 본 패키지 과정 수강 완료 후, 관광일자리센터 취업프로그램을 일정 기준 이상 수료한 교육생 혜택 : 기준 충족 시 한국관광공사 사장 명의의 특별수료증 추가 발급, 관광인 구인등록 기업 우선 추천, 관광일자리센터 프로그램 참여 기회 우선 제공, 우수 참여자 대상 시상 세부내용 : 이벤트 페이지 참조 (하이퍼링크)","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500485&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"예약률 향상 위한 플랫폼 운영 전략","g":["2025","공사사업","선택강좌","숙박","숙박업","안전민박"],"h":"정대준","r":"1. OTA 플랫폼 운영이 처음인 예비 창업자 및 숙소 신규 등록자 2. 플랫폼 노출과 예약 전환율 개선에 어려움을 겪는 학습자 3. 온라인 마케팅과 OTA 구조에 대한 기본 개념이 부족한 학습자 4. 숙소 사진과 상세 페이지 구성을 통해 예약을 높이고자 하는 학습자","o":"OTA(Online Travel Agency)의 개념과 대표 플랫폼별 차이를 이해할 수 있다. 온라인 마케팅의 핵심 요소와 고객의 예약 흐름을 분석할 수 있다. 플랫폼 내 노출 순위에 영향을 주는 요소들을 파악하고 숙소에 적용할 수 있다. 숙소 사진의 중요성과 예약을 이끄는 이미지 구성 전략을 익힐 수 있다.","d":"공유숙박 및 숙박업 운영에서 OTA(Online Travel Agency) 플랫폼은 매출을 좌우하는 핵심 채널입니다. 하지만 많은 운영자들이 플랫폼의 구조나 노출 원리를 정확히 이해하지 못한 채로 운영을 시작하는 경우가 많습니다. 본 강의는 OTA의 개념과 주요 플랫폼의 특성을 비교 분석하고, 예약 유도에 직접적인 영향을 주는 온라인 마케팅 요소, 노출 순위 요인, 숙소 사진 전략까지 실전 중심으로 다룹니다. 숙소를 보이게 하고, 클릭하게 하며, 예약까지 이끄는 OTA 운영 전략을 체계적으로 익힐 수 있는 교육입니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500280&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"평점 4.9를 지키는 후기 관리 요령","g":["2025","공사사업","선택강좌","숙박","숙박업","안전민박"],"h":"김기태","r":"1. 후기나 평점 관리에 어려움을 느끼는 모든 분 2. 슈퍼호스트를 목표로 평점 4.9 이상 유지를 고민 중인 학습자 3. 부정적인 후기를 효과적으로 예방하거나 대응하고 싶은 학습자 4. 플랫폼 평점 시스템과 고객 리뷰의 실제 영향력을 알고 싶은 학습자","o":"후기와 평점이 숙소운영에 미치는 실질적인 효과와 영향력을 이해할 수 있다. 후기 및 별점 관련 통계자료와 인식을 분석하고, 플랫폼 평점 구조를 파악할 수 있다. 부정적인 후기가 발생하는 원인과 게스트 불만 유형을 파악해 예방할 수 있다. 평점 4.9 유지를 위한 다섯 가지 핵심 전략을 익히고 실천할 수 있다.","d":"플랫폼에서 후기와 평점은 곧 숙소의 신뢰도이자 예약률에 직접적인 영향을 주는 핵심 지표입니다. 본 강의는 후기 관리에 어려움을 겪는 운영자 및 예비 호스트를 대상으로 후기 및 별점이 실제 매출에 미치는 영향력과 통계, 부정적 리뷰가 발생하는 주요 원인, 그리고 고객 불만을 유발하는 리뷰 주제를 구체적으로 짚어보며, 실전 팁 5가지를 중심으로 숙소 운영 감각과 리뷰 대응 노하우를 함께 익힐 수 있습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500279&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"고객의 예약을 부르는 숙소 사진 촬영 노하우","g":["2025","공사사업","선택강좌","숙박","숙박업","안전민박"],"h":"김종훈","r":"1. 공유숙박 창업을 준비 중인 모든 분 2. 숙소는 등록했지만, 사진이 중요한 이유나 개선 방법이 막연한 학습자 3. 사진 퀄리티가 부족하다고 느끼며 촬영 기술에 자신 없는 학습자 4. 예약률 향상을 위해 상위노출 전략과 사진 콘텐츠 개선이 필요한 학습자","o":"공간임대업에서 사진이 왜 중요한지 이해하고, 그 필요성을 이해할 수 있다 홍보사진 촬영에 필요한 기본 장비와 촬영 원리를 익힐 수 있다 스마트폰 또는 DSLR을 활용한 숙소 촬영법의 기본을 익힐 수 있다. 예약률과 매출에 영향을 주는 사진 구성 전략을 실전 적용할 수 있다.","d":"공유숙박 플랫폼에서 고객이 예약을 결정짓는 가장 강력한 요소 중 하나는 숙소의 첫인상을 좌우하는 사진입니다. 본 강의는 예비 창업자 및 운영자를 대상으로,공간임대업에서 사진이 왜 필수인지에 대한 이해부터, 스마트폰과 DSLR을 활용한 실전 촬영법, 그리고 에어비앤비 상위노출 알고리즘과 연결되는 예약률을 높이는 사진 구성 공식까지, 사진을 통한 브랜딩과 경쟁력 강화에 실질적인 도움을 주는 교육입니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500278&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"실제 운영 사례로 보는 한옥 숙소 마케팅","g":["2025","공사사업","선택강좌","숙박","숙박업","안전민박"],"h":"손지영","r":"1. 한옥체험업 창업을 준비 중인 모든 분 2. 숙소 창업은 했지만 마케팅이 낯선 학습자 3. 마케팅은 하고 있으나 더 효과적인 전략을 찾고 있는 학습자 4. 실제 사례를 통해 한옥숙박 마케팅을 배우고자 하는 학습자","o":"한옥숙박업 창업 시 전반적인 창업 과정을 이해하고 준비할 수 있다. 한옥숙박업 운영에 필요한 체크리스트를 확인하고 현장에 적용할 수 있다. 운영자 중심의 실전 마케팅 전략을 익혀 직접 실천할 수 있다. 사례 기반 학습을 통해 효과적인 한옥체험업 마케팅을 기획·실행할 수 있다.","d":"최근 전통문화와 지역성을 반영한 숙박 형태로 한옥체험업이 주목받고 있습니다. 본 강의는 예비 창업자와 기존 운영자를 대상으로 한옥숙박업 창업 절차, 실무 체크리스트, 실전 마케팅 전략을 체계적으로 제시합니다. 또한 실제 운영사례를 통해 같은 공간도 기획과 운영 방식에 따라 어떻게 다른 성과를 낼 수 있는지 살펴보며, 보다 차별화된 한옥숙소 운영 전략을 수립할 수 있도록 돕습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500277&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"고객의 꿀잠을 보장하는 침구류 선택과 관리요령","g":["2025","공사사업","선택강좌","숙박","숙박업","안전민박"],"h":"이상엽","r":"1. 공유숙박을 처음 시작하는 모든 분 2. 침구 세탁, 보관, 오염 대응 등 기본 운영이 막막한 학습자 3. 예산에 맞는 침구 선택과 관리 노하우가 필요한 학습자 4. 후기 관리를 위해 위생적인 침구 운영 루틴을 정립하고 싶은 학습자","o":"게스트 만족도와 위생을 위한 침구 운영의 기본 원칙을 이해할 수 있다. 예산과 숙소 타입에 맞는 침구 소재 및 구성을 선택할 수 있다 효율적인 세탁/건조 루틴과 침구 수량 운영 팁을 숙지할 수 있다. 침구 오염 대응법과 플랫폼별 보상 절차를 익혀 실전에 적용할 수 있다. 스타일링과 위생을 모두 만족시키는 침구 유지관리 전략을 실천할 수 있다.","d":"공유숙박 운영에서 침구는 ‘게스트의 수면 퀄리티’뿐만 아니라 후기, 평점, 재방문율에 결정적 영향을 미치는 요소입니다. 하지만 많은 예비 호스트나 운영자들이 무엇을 사야 하고, 어떻게 관리해야 하며, 언제 교체해야 하는지에 대한 기준 없이 시작하는 경우가 많습니다. 본 강의는 8년차 숙소 운영자가 실전 경험을 바탕으로, 초보자도 바로 적용할 수 있는 침구 운영의 모든 것을 Q&A 방식으로 전달합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500275&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"숙박업 관련 세금과 절세요령","g":["2025","공사사업","선택강좌","숙박","숙박업","안전민박"],"h":"박준용","r":"1. 공유숙박 창업을 준비 중인 분 2. 사업자등록은 완료했지만 영업신고 등 행정 절차가 익숙하지 않은 학습자 3. 숙소 운영 중 세무 신고 및 절세 방안에 대한 실무 지식이 필요한 학습자 4. 공유숙박 운영과 관련한 세금·행정절차 전반을 폭넓게 이해하고자 하는 학습자","o":"공유숙박업 창업 시 사업자등록 및 영업신고 절차를 이해하고 준비할 수 있다. 공유숙박 운영에 필요한 세금 종류(부가가치세, 소득세 등)를 구분하고 신고할 수 있다. 절세 전략과 실무 팁을 익혀 세무 리스크를 줄일 수 있다. 합법적이고 안정적인 공유숙박 운영 기반을 마련할 수 있다.","d":"최근 공유숙박업의 영업신고증 발급이 의무화되면서, 창업 초기 단계의 혼란과 행정 절차에 대한 궁금증이 커지고 있습니다. 본 강의는 예비 호스트 및 초보 운영자를 대상으로 사업자등록부터 영업신고증 발급 절차, 그리고 숙소 운영 시 필수적으로 알아야 할 세금 신고 및 절세 전략까지 폭넓게 다루어, 실질적인 운영 역량을 높이고 안정적인 숙박업 진입을 돕고자 마련되었습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500274&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"숙소 화재 사례별 예방과 대응방법","g":["2025","공사사업","숙박","숙박업","안전민박","필수강좌"],"h":"유연혁","r":"1. 공유숙박, 민박업, 게스트하우스 등 숙박시설을 운영 중인 학습자 2. 소방안전 지식이 부족한 예비 호스트 및 창업 준비자 3. 화재 발생 시 초기 대응에 자신이 없는 학습자 4. 게스트 안전을 위한 숙소 내 피난·소화기 관리 기준이 필요한 학습자","o":"숙박시설의 특성과 화재 위험 요인을 이해할 수 있다. 숙소 화재 발생 시 단계별 대응 요령을 숙지할 수 있다. 소화기의 종류와 소화기의 올바른 사용법을 익힐 수 있다. 피난시설의 위치와 사용 방법을 파악하고 안내할 수 있다.","d":"숙박시설은 구조적 특성상 화재 발생 시 피해 확산 속도가 빠르고 인명사고 위험이 높아 철저한 예방과 대응 요령이 필수적입니다. 본 강의는 숙박업 종사자 및 공유숙박 운영자를 대상으로, 숙박시설의 화재 취약성, 화재 발생 시 행동요령, 소화기 사용법과 피난시설의 중요성까지 실무 중심으로 안내합니다. 위기 상황에서 게스트와 본인의 안전을 지킬 수 있는 기초 소방안전 역량을 키울 수 있도록 구성되었습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500273&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"호스트가 알아야 할 상황별 응급처치와 심폐소생술","g":["2025","공사사업","숙박","숙박업","안전민박","필수강좌"],"h":"유연혁","r":"1. 공유숙박, 민박업, 게스트하우스를 운영 중인 학습자 2. 게스트 응급상황 발생 시 대처 경험이 부족한 예비 호스트 및 신규 운영자 3. 기본 응급처치와 안전관리 지식이 필요한 학습자 4. 응급상황 대응 체계를 숙소 운영에 반영하고자 하는 학습자","o":"숙소 운영 중 발생할 수 있는 응급상황(화상, 식중독, 외상)에 대해 올바른 초기 대응 방법을 숙지할 수 있다. 심정지 발생 시, 심폐소생술(CPR)을 정확히 이해하고 적용할 수 있다. 게스트 안전과 시설물 관리를 위한 기본적인 안전관리 수칙을 인지하고 실천할 수 있다.","d":"공유숙박 및 숙박업 운영 중에는 화상, 식중독, 외상, 심정지 등 다양한 응급 상황이 예상치 못하게 발생할 수 있습니다. 본 강의는 숙소 운영자들이 현장에서 실제 마주하게 되는 응급상황에 신속하고 정확하게 대처할 수 있도록 응급처치 요령(화상, 식중독, 외상, CPR)을 단계별로 설명하며, 게스트와 시설물의 안전을 함께 지키기 위한 기본 대응역량을 키울 수 있도록 구성되었습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500272&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"해충 발생 예방을 위한 숙소 위생관리 요령","g":["2025","공사사업","숙박","숙박업","안전민박","필수강좌"],"h":"황성제","r":"1. 공유숙박을 운영 중이거나 준비 중인 모든 분 2. 숙소 내 위생 관리에 어려움을 겪거나 해충 민원 대응에 부담을 느끼는 학습자 3. 클레임 예방과 평점 관리에 관심이 많은 학습자 4. 전문 방제 서비스 활용 여부에 대한 판단 기준이 필요한 학습자","o":"공유숙박 공간에서 자주 발생하는 해충의 유형과 특성을 이해할 수 있다. 실제 숙소 피해 사례를 통해 해충 관리의 중요성과 예방의 필요성을 인식할 수 있다. 숙소 운영 중 해충 발생 시, 적절한 대응 방법과 절차를 숙지할 수 있다. 전문 방제 서비스의 활용 기준과 선택 시 유의사항을 판단할 수 있다.","d":"최근 공유숙박 시장의 성장과 더불어, 숙소 위생과 청결 관리는 운영자의 기본 역량이자 숙소 선택의 핵심 기준으로 주목받고 있습니다. 본 강의는 예비 창업자와 기존 운영자를 대상으로, 공유숙박 환경에서 자주 발생하는 해충 문제의 원인과 대응 방법, 사전 예방 관리법, 전문 방제 활용 기준까지 실무 중심으로 정리해 안내합니다. 특히 실제 숙소에서 발생한 클레임 사례와 진단 결과를 통해, 운영 방식의 차이가 어떻게 후기와 매출로 이어지는지를 살펴보고, 보다 체계적이고 경쟁력 있는 숙소 위생 관리 전략을 수립할 수 있도록 돕습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500271&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"상품기획/개발","t":"지역 특화 컨셉의 숙박 상품 및 서비스 기획 사례","g":["ICT","개발","글로벌","데이터","디지털활용","로컬","상품기획","숙박","숙박업","차별화된","창업","트렌드","특화관광"],"h":"최준호(온다 대외홍보실장) 이찬민(두왓 총괄) 이상묵(스테이폴리오 전 대표)","r":"중소여행사 CEO / 실무자","o":"","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 5개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란?","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202400574&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"상품기획/개발","t":"차별화된 숙박 상품 및 서비스 기획 사례","g":["ICT","개발","글로벌","데이터","디지털활용","로컬","상품기획","숙박","숙박업","차별화된","창업","트렌드","특화관광"],"h":"최준호(온다 대외홍보실장) 이찬민(두왓 총괄) 이상묵(스테이폴리오 전 대표)","r":"중소여행사 CEO / 실무자","o":"","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 5개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란?","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202400573&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"상품기획/개발","t":"ICT를 활용한 고객 맞춤형 숙박 서비스 기획","g":["ICT","개발","글로벌","데이터","디지털활용","로컬","상품기획","숙박","숙박업","차별화된","창업","트렌드","특화관광"],"h":"최준호(온다 대외홍보실장) 이찬민(두왓 총괄) 이상묵(스테이폴리오 전 대표)","r":"중소여행사 CEO / 실무자","o":"","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 5개의 과정을 수료해야 수료증을 발급 받을 수 맞게 사용할 수 있다. 일반적인 고객 요청사항을 응대하고, 정중히 거절하는 표현을 익혀 서비스에 적용할 수 있다. 식음료업에서의 기본적인 서비스 단계에 따른 응대 표현 및 각종 호텔 내부 시설에 대한 안내를 다양한 상황에 맞춰 제공할 수 있다.","d":"익숙한 한국어가 아닌, 영어로 호텔 고객을 응대해야하는 상황을 위해 단계별 실전에서 표현 가능한 호텔영어에 대해 학습할 수 있습니다. 호텔에서 기본적으로 사용되는 다양한 상황에 맞는 표현을 익혀두면, 영어를 사용하는 고객이 방문해도 당황하지 않고 차분하게 멋진 서비스를 제공할 수 있습니다. 대표적인 호텔서비스 응대 상황의 표현이 단계별로 나누어져 있어, 확실하고 꼼꼼하게 익힐 수 있답니다! *본 과정은 한글 자막 없이 영어로 진행됩니다. 수강신청 후 '나의강의실' 내 자료실에서 학습보조자료를 다운로드 받아서 학습에 참고하여 주십시오.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000271&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"쉽게 이해하는 연회판촉 A to Z","g":["고객관리","서비스","숙박","숙박업","연회","판촉","호텔업"],"h":"박경연 교수(한양여자대학교 호텔관광과)","r":"관광숙박업종사자","o":"연회 행사 잠재 거래처 현황 파악과 관리의 중요성을 파악할 수 있다. 다양한 판촉활동 방법을 통해 고객 관계를 구축할 수 있다.","d":"여러분은 연회판촉 활동을 위해 어떤 준비를 하고 계신가요? 연회행사를 유치하기 위한 잠재 거래처 현황파악과 관리, 그리고 고객과의 관계구축, 연회행사의 성격에 따라 다양한 프로모션 기획의 방법을 알려 드립니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000270&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"쉽게 이해하는 연회행사관리 A to Z","g":["고객관리","서비스","숙박","숙박업","연회","행사","호텔업"],"h":"박경연 교수(한양여자대학교 호텔관광과)","r":"관광숙박업종사자","o":"연회 행사 준비 및 종료 후 연회장 청결도를 확인할 수 있다. 연회장 현장 인원을 교육할 수 있다. 연회 행사 중 발생하는 고객의 요구 사항을 처리할 수 있다.","d":"여러분은 연회 행사를 진행하기 위해 어떤 준비를 하고 계신가요? 연회행사 준비부터 종료, 그리고 연회행사 중 발생하는 고객의 요구사항 처리까지 연회행사의 모든 것을 알려 드립니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000269&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"관광숙박업종사자를 위한 GRO/Executive 에센셜","g":["EFL","GRO","고객관리","서비스","숙박","숙박업","호텔업"],"h":"김진수 교수(부천대학교)","r":"관광숙박업종사자","o":"VIP 응대를 위한 GRO의 주요 업무를 알고 VIP고객에 대한 버틀러 서비스를 설명할 수 있다. EFL을 방문하는 고객을 위한 익스프레스 체크인/ 체크아웃과 식음료서비스를 할 수 있다.","d":"특급호텔은 GRO라는 스태프를 따로 두고 고객들에게 보다 밀착된 서비스를 제공하고 있습니다. VIP고객을 위한 예약과 회의 준비, 통역, 칵테일 제조까지 정신 없이 일하는 GRO의 일상을 엿보며 바쁜 일상 속 잠시 힐링할 수 있게 돕는 EFL라운지의 기능도 함께 알아보도록 하겠습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000268&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"관광숙박업종사자를 위한 현관서비스&컨시어지 에센셜","g":["고객관리","도어맨","서비스","숙박","숙박업","컨시어지","호텔업"],"h":"김진수 교수(부천대학교)","r":"관광숙박업종사자","o":"도어맨의 주요 업무를 설명할 수 있습니다. 벨맨의 주요 업무를 설명할 수 있습니다. 컨시어지의 개념을 알고 컨시어지의 역할을 알 수 있습니다.","d":"관광숙박업종사자를 위한 현관서비스와 컨시어지 에센셜에 대해 학습할 수 있습니다. 고객의 편의를 위해 호텔 구석구석 보이지 않는 곳에서 많은 사람들이 자신의 역할을 묵묵히 수행하고 있습니다. 호텔 입구에서 고객을 맞이하며 우리 호텔의 첫인상을 심어주는 도어맨, 고객이 체류하는 동안 고객 접객 서비스를 제공하는 벨맨, 그리고 VIP 고객을 가장 가까운 곳에서 고품질의 서비스를 제공하는 컨시어지가 있습니다. 이들은 주로 어떤 업무를 하는지 살짝 엿보도록 할까요?","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000267&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"관광숙박업종사자를 위한 프론트데스크 에센셜","g":["객실관리","고객관리","서비스","숙박","숙박업","프론트데스크","호텔업"],"h":"지윤호(강원대학교 관광경영학과)","r":"관광숙박업종사자","o":"객실정보를 파악하여 고객 예약을 응대할 수 있다. 프론트 데스크에서 고객의 니즈를 파악하여 고객이 원하는 서비스를 제공할 수 있다. 재실 중인 고객의 요청 사항을 파악하여 이를 처리할 수 있다. 체크아웃 절차를 숙지하고 체크아웃 상황에 발생하는 여러 상황에 대처할 수 있다.","d":"관광숙박업 종사자를 위한 프론트데스크 에센셜에 대해 학습할 수 있습니다. 호텔에서 고객을 가장 먼저 맞이하는 곳은? 바로 프런트데스크입니다! 고객의 예약과 체크인과 체크아웃을 담당하고, 문의 및 불만사항을 전담하는 프런트데스크 서비스의 기본을 점검해보세요. 우리 호텔의 첫인상은 어떤지 다시 한 번 확인하는 시간이 될 것입니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000266&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"핵심만 콕! 호텔&리조트 연회서비스","g":["고객관리","서비스","숙박","숙박업","연회","호텔업"],"h":"조윤희 교수(중부대학교 호텔 비지니스전공)","r":"관광숙박업종사자","o":"연회서비스의 기본적인 개념을 알 수 있습니다. 연회에서 사용되는 장비와 집기를 알고 이를 실제 활용할 수 있습니다. 연회서비스의 종류에 따라 달라지는 테이블 배치를 할 수 있습니다.","d":"호텔과 리조트의 연회서비스는 객실과 함께 호텔과 리조트 등급에 영향을 미치는 중요한 요인으로 매출의 성장에 기여를 하고 있습니다. 연회서비스의 분류와 종류부터 연회서비스에서 사용되는 장비와 집기, 그리고 연회의 성격에 따라 달라지는 테이블 배치와 메뉴 등에 대해 알아보도록 하겠습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000265&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"핵심만 콕! 호텔&리조트 부대시설관리","g":["고객관리","레스토랑","서비스","숙박","숙박업","식음료","호텔업"],"h":"박상민(국제호텔직업전문학교 호텔관광경영과 학과장)","r":"관광숙박업종사자","o":"호텔 레스토랑에서 사용하는 기물의 종류를 알고 테이블을 세팅할 수 있다. 메뉴 주문을 받고 격식을 갖추어 음식을 고객에게 서빙할 수 있다. 음료의 재료를 준비하여 음료를 제조할 수 있다. 호텔 수영장 관리에 대하여 설명할 수 있다.","d":"고객의 니즈에 맞춘 호텔&리조트 부대시설 관리에 대해 학습할 수 있습니다. 호텔은 여러 부대시설을 운영하고 있는데 이 중 고객이 가장 많이 접하는 호텔레스토랑에서 메뉴를 주문하는 방법과 음료를 준비하여 고객에게 제공할 수 있는 음료를 제조하는 방법에 대해 알아보도록 하겠습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000264&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"F&B 마스터 키트 주방위생안전관리","g":["F&B","고객관리","서비스","숙박","위생","주방","호텔업"],"h":"최원식(오션플러스 케이터링 사업 본부장)","r":"관광숙박업종사자","o":"호텔 주방에서의 위생관리를 알고 이를 활용하여 관리할 수 있다. 호텔 주방에서의 안전에 대한 기본 수칙을 습득하여 안전하게 주방을 관리할 수 있다.","d":"고객의 먹거리를 책임지는 호텔의 주방은 다른 어느 곳보다 위생을 철저히 해야 하는 곳이며 직원의 안전이 보장되어야 하는 곳이기도 합니다! 호텔 주방의 위생관리에 대한 기본적인 수칙과 안전관리에 대해 같이 확인해 보도록 할까요?.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000263&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"F&B 마스터 키트 조리서비스","g":["F&B","고객관리","서비스","숙박","조리","주방","호텔업"],"h":"최원식(오션플러스 케이터링 사업 본부장)","r":"관광숙박업종사자","o":"조리사의 기본 자세를 알고 주방 실무 매뉴얼을 활용할 수 있다. 주방설비의 특성과 기물의 종류를 알고 이를 관리할 수 있다. 습식열조리, 건식열조리, 복합열조리를 할 수 있다. 서양요리의 기본 육수와 소스를 만들 수 있다.","d":"호텔 조리사의 기본자세와 주방 실무 매뉴얼이 궁금하신가요? 또한 주방 설비와 기물들은 어떻게 관리되고 있으며 호텔에서 주로 활용하고 있는 조리방법 및 조리서비스에 대해서도 간단히 알려 드립니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000262&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"F&B 마스터 키트 식음서비스","g":["F&B","고객관리","서비스","숙박","식음료","테이블","호텔업"],"h":"김광우 교수(국제대학교 호텔조리학과)","r":"관광숙박업종사자","o":"테이블 세팅 시 필요한 기물과 주의사항을 알고 이를 활용할 수 있다. 서비스 제공 시 상황별 대처 방법을 알 수 있다. 음료의 기본적인 특징을 알고 이를 고객에게 제공할 수 있다.","d":"호텔에서 판매되는 상품인 식음료는 고객의 식욕을 충족시켜주는 핵심 상품으로 우리 호텔 직원들이 각별히 신경 써야 하는데요, 가장 기본적인 테이블세팅 방법과 서비스 제공 시 상황별 대처 방법을 사례를 통해 살펴보시기 바랍니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000261&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"나를 깨우는 문제해결","g":["갈등관리","고객관리","문제해결","서비스","숙박","숙박업","직장생활"],"h":"배은영(유탑호텔 교육부장)","r":"관광숙박업종사자","o":"갈등의 원인을 올바르게 인식하고 갈등 상황이 발생할 경우 문제와 사람을 분리할 수 있다. 올바른 갈등 해결을 위해 자신의 감정을 조절하고 갈등 문제에 따라 적절한 대응 방식을 선택할 수 있다. 문제를 올바르게 인식하고 적절히 해결하는 능력을 기를 수 있다. 문제를 해결하기 위해서 창의적, 논리적, 비판적으로 생각하는 능력을 기를 수 있다.","d":"조직에서 일어나는 여러 문제와 갈등을 해결하기 위한 좋은 방법은 없을까?에 대한 고민은 누구나 가지고 있을 것입니다. 갈등의 원인을 분석하고 올바른 갈등 해결을 위한 방법과 문제를 해결하기 위한 능력을 키울 수 있는 노하우를 제공해 드립니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000260&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"나를 깨우는 커뮤니케이션","g":["경청","고객관리","서비스","숙박","숙박업","직장생활","커뮤니케이션"],"h":"양성윤(한양여자대학교 호텔관광과 조교수)","r":"관광숙박업종사자","o":"커뮤니케이션의 의미와 중요성을 알 수 있습니다. 커뮤니케이션의 저해요인 및 효과적인 커뮤니케이션 방법에 대하여 설명할 수 있습니다. 경청의 이미와 중요성을 알 수 있습니다. 효과적인 경청방법과 올바른 경청을 방해하는 요인에 대해 설명할 수 있습니다.","d":"우리는 종종 커뮤니케이션의 어려움을 느끼고, 효과적인 커뮤니케이션 방법에 대해 많은 고민을 합니다! 나만의 방법으로 커뮤니케이션을 한다면 그것은 진정한 소통일까요?. 우리 관광숙박업종사자들에게 필요한 커뮤니케이션의 개념과 필요성, 커뮤니케이션의 저해요인 및 효과적인 커뮤니케이션 방법, 경청의 노하우를 확인해 보시기 바랍니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000259&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"나를 깨우는 자기개발","g":["고객관리","서비스","숙박","숙박업","자기개발","직장생활"],"h":"양성윤(한양여자대학교 호텔관광과 조교수)","r":"관광숙박업종사자","o":"자기개발의 필요성을 알고 계획을 수립할 수 있습니다. 자아인식의 방법, 업무와 관련한 자기 특성파악 및 자아성찰을 할 수 있습니다. 자기관리 단계별 계획과 계획 수립방법을 작성할 수 있습니다.","d":"우리를 둘러싸고 있는 환경은 끊임없이 변화하고 있고, 그 변화의 속도는 점점 빨라짐에 따라 관광숙박업종사자 여러분들에게도 지속적인 학습을 통한 성장이 요구되며 자신의 특성을 파악하고 이에 적합한 능력을 개발하기 위한 자기개발이 매우 중요하게 되었습니다. 내가 소속되어 있는 조직에서 자기개발은 왜 필요한지, 내가 생각하는 이상적인 조직원이 되기 위해 인식하고 있는 것은 무엇인지, 나 자신을 알아가는 방법에는 어떤 것이 있는지 알아보도록 하겠습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000258&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"나를 깨우는 동기부여","g":["고객관리","동기부여","서비스","숙박","숙박업","직장생활"],"h":"이영범(에듀달란트 대표)","r":"관광숙박업종사자","o":"자신의 몰입경험을 통한 내재적 동기의 의의를 설명할 수 있습니다. 내재적 동기부여와 몰입을 위한 실천 방법을 습득하고, 이를 활용할 수 있습니다. 조직구성원의 헌신을 자극하고, 몰입을 이끌어내기 위한 보편적인 동기부여 방법을 알고 활용할 수 있습니다.","d":"여러분은 업무를 수행할 때, 어떤 경우에 몰입하거나, 또 동기부여 되었는지요? 우리의 직책, 직업, 성별, 연령과 무관하게, 어떤 행동을 하도록 원인을 제공하고 업무와 학습의욕을 유발하는 동기부여는 그 누구에게나 선택이 아닌 필수입니다. 내재적 동기부여와 몰입, 동기부여 이론을 학습하면서 미래의 리더로 첫 걸음을 떼어보세요. 호텔&리조트의 보이는 곳, 보이지 않는 곳에서 최선을 다하고 있는 미래의 리더들에게 동기부여의 고수로 도전하는 방법을 알려 드립니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000257&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"궁금타파! 고객만족을 넘어 고객감동","g":["고객감동","고객관리","고객만족","서비스","숙박","호텔업"],"h":"정선희((주)SK네트웍스 워커힐)","r":"관광숙박업종사자","o":"숙박산업의 고객관리(CRM)와 고객마케팅(CRM)의 중요성과 전략을 알 수 있습니다. 사업장을 방문하는 고객의 만족을 이끌어내기 위한 서비스를 파악하여 고객만족을 높이고 불만을 처리할 수 있습니다.","d":"숙박산업의 경쟁 심화와 고객의 니즈는 다양하게 변화하고 있고 고객만족을 넘어 고객감동이 필요합니다. 따라서 신규 고객을 창출하고 기존 고객을 유지하기 위해 고객의 니즈를 이해하며 예측을 통해 대응해야 하는데 이는 고객과 커뮤니케이션을 기반으로 한 긍정적 관계를 통해 가능할 것입니다. 고객의 만족을 넘어 고객 감동을 주는 기초적인 이론부터 전략까지 이번시간을 통해 함께 알아보면서 우리 호텔 조직에 어떻게 적용할지 함께 고민해 보도록 하겠습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000256&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"관광숙박업종사자를 위한 객실정비 에센셜","g":["객실관리","고객관리","서비스","숙박","숙박업","하우스키핑","호텔업"],"h":"정지혜(서울앤호텔 총지배인)","r":"관광숙박업종사자","o":"호텔의 객실 상품을 생산하여 판매하기 위해 객실 정비, 객실 점검, 공용 부분 정비, 턴다운 서비스 업무를 설명할 수 있다. 객실 점검표(Room Inspection Check List)에 근거하여 객실의 청소 상태, 청결 유지, 설치물(비품·소모품)과 가구·집기의 기능 상태 점검을 할 수 있다. 호텔 약관의 습득물 관리 규정을 기준으로 객실 및 영업장, 공공지역 등 호텔 전반 의 습득물을 관리할 수 있다. 보고서 작성 지침에 따라 하우스키핑 업무의 일별, 주별, 월별, 분기별, 연말 보고서를 작성할 수 있다.","d":"그동안 우리 호텔에서의 객실정비의 매뉴얼을 점검해보고 싶다면 주목해주세요! 관광숙박업종사자를 위한 전반적인 객실 시설 관리부터 하우스키핑과 턴다운 서비스의 효율적인 순서와 동선을 확인하여, 업소 서비스를 개선해보는 방법을 알려드립니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000248&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"F&B 마스터 키트 커피바리스타","g":["F&B","고객관리","바리스타","서비스","숙박","커피","호텔업"],"h":"김광우 교수(국제대학교 호텔조리학과)","r":"관광숙박업종사자","o":"커피 원두의 특징을 알고 블렌딩 방법을 설명할 수 있다. 에스프레소 머신을 알고 에스프레소 머신을 활용하여 커피를 추출할 수 있다.","d":"커피, 그리고 원두에 대해 기본적인 내용만 탄탄하게 알아도, 고객의 니즈에 맞춘 질높은 커피 서비스가 가능합니다! 호텔에 방문하는 고객에게 풍미높은 한 잔의 커피로 즐거운 경험을 제공해보세요.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000247&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"F&B 마스터 키트 칵테일 조주","g":["F&B","고객관리","서비스","숙박","숙박업","칵테일","호텔업"],"h":"박창수 (동양미래대학교 호텔관광학과 교수)","r":"관광숙박업종사자","o":"칵테일의 조주기법, 칵테일을 만들때 쓰이는 기물을 설명할 수 있다. 칵테일 조주기법을 통해 네그로니, 드라이 마티니, 코스모폴리탄을 만들 수 있다.","d":"복잡해보이는 칵테일 조주, 기본부터 쉽게 배워보세요! 칵테일 조주에 사용되는 도구와 기본 기법을 차근차근 알려드립니다! 아늑한 바 분위기를 느끼며 전문가와 함께 대표적인 칵테일 조주법을 익혀보세요.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000246&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"F&B 마스터 키트 와인소믈리에","g":["고객관리","서비스","소믈리에","숙박","숙박업","와인","호텔업"],"h":"김협(한국 국제 소믈리에 협회 이사)","r":"관광숙박업종사자","o":"와인의 특성을 이해하고 와인의 종류에 따라 와인을 오픈할 수 있다. 와인 서비스를 습득하여 격식에 맞게 고객을 맞이할 수 있다.","d":"호텔 레스토랑 메뉴에 빠질 수 없는 와인! 와인 서비스 제공을 위해 꼭 알아야할 와인오픈 팁과 서빙법 함께 와인을 즐길 수 있는 방법을 알아보세요.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000245&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"마케팅/홍보/세일즈","t":"쉽게 이해하는 호텔판촉 A to Z","g":["거래처관리","마케팅","세일즈","숙박","숙박업","판촉","호텔업","홍보"],"h":"박경연 교수(한양여자대학교 호텔관광과)","r":"관광숙박업종사자","o":"거래처 현황을 파악하고 비교·분석할 수 있다. 거래처 방문 교정에 따라 거래처 방문을 시행할 수 있다. 충성 고객들을 관리하기 위해 이벤트를 기획할 수 있다. 고객의 소리 관리 시스템을 수립할 수 있다.","d":"거래처의 현황을 체계적으로 파악하고, 거래처 방문 규정에 따라 효율적으로 방문 일정을 관리하여, 우리 호텔의 좋은 상품을 정리하고 적시에 판매할 수 있는 호텔판촉 방법을 알아보세요. 고객의 시간과  예비 창업자 2. 관광민박업을 운영하는 민박업주 3. 에어비앤비를 운영하는 민박업주 4. 지역 내 특산물, 관광자원을 활용해 숙소를 홍보하고 싶은 민박업주","o":"게스트하우스 창업을 위해 어떤 준비가 필요한지 알 수 있다 숙박업 관련 세금과 4대보험의 절세 방법을 알 수 있다. 에어비앤비 슈퍼호스트의 채널 운영 노하우를 알 수 있다 숙박업을 운영하며 발생하는 법률적 분쟁사례를 미리 알고 대비할 수 있다. 이종업종간의 네트워킹을 통한 수익창출방법을 알 수 있다.","d":"게스트하우스 창업을 준비하는 예비창업자부터, 이미 경력이 5~6년 이상되어 새로운 지식이 필요하신 분들을 대상으로 민박업/숙박업 운영시 필요한 다양한 분야의 정보를 담았습니다. 게스트하우스 창업을 위한 관련 법과 절차, 법률상식, 에어비앤비 운영 노하우, 숙박업 운영비 절감을 위한 절세 노하우 등의 내용이 있습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000115&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"공사사업","t":"2021 온라인 민박업 교육(마케팅/홍보)","g":["게스트하우스","공사사업","민박업","숙박","숙박업"],"h":"황규진(서울매니아 대표)","r":"1. 인스타그램으로 숙소를 홍보하고 싶은 민박업 사장님 2. 본인이 직접 숙소 홍보를 하길 희망하는 민박업주 3. 라이브커머스 플랫폼을 통해 숙소판매를 준비중인 민박업주","o":"인스타그램의 주요 기능과 채널의 특징을 알고 숙소 홍보를 위한 운영방안을 알 수 있다. 네이버 블로그 운영을 위한 주기적인 글쓰기 소재 찾기, 네이버 플레이스 등록 등 네이버 채널에서 소규모 민박업주가 실질적으로 적용가능한 홍보방법을 알 수 있다. 라이브커머스 채널을 통한 숙소 판매시 필요한 준비사항과 각 과정별 판매전략을 알 수 있다.","d":"소규모 민박업을 운영하는 사업주가 지금 당장 비용없이 시작할 수 있는 인스타그램, 블로그 등의 SNS 마케팅 방법과 최근 유행하고 있는 라이브커머스 플랫폼을 활용한 숙소 판매 전략 등 실질적으로 적용 가능한 마케팅, 홍보 교육을 담았습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000114&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"숙박","s":"고객관리/서비스","t":"호텔리어","g":["고객관리","서비스","숙박","호텔","호텔리어","호텔업"],"h":"정지혜(한국관광공사 호텔리어 양성과정 호텔객실분야 강사)","r":"1. 관광고교학생 등 관련 학과 호텔취업준비생 2. 호텔리어 및 예비호텔리어 3. 관심있는 학습자","o":"호텔리어의 자세를 익힐 수 있다. 호텔 체인과 브랜드에 대해 설명할 수 있다. 호텔 산업의 특징, 호텔 기획 전략, 호텔의 경영전략 사례에 대해 이해할 수 있다. 객실관리(FO)부서, Front office 및 Housekeeping 직무와 업무에 대해 이해할 수 있다. 호텔 PMS로 예약 생성, 체크 인, 체크 아웃의 업무를 수행할 수 있다. 호텔 식음료 업장, 연회행사, 기물종류 활용, 식음료 업장별 업무에 대해 이해할 수 있다. 와인의 개요, 서비스 방법, 음식 특성에 따른 와인 추천에 대해 이해할 수 있다.","d":"NCS기반으로 제작된 본 과정을 통해 호텔리어의 호텔 현장 실무능력을 강화시킬 수 있습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000073&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0300"},{"a":"직무강좌","b":"안내/해설","s" "o":"일제 식민지화 과정과 역사적 배경 이해 : 19세기 말 한반도를 둘러싼 국제 정세와 열강의 충돌 속에서 식민지화 과정을 이해한다. 독립운동의 전개와 저항의 역사 탐구 : 동학농민운동부터 국내외 독립운동까지 다양한 저항의 흐름과 그 의미를 살펴본다. 식민지 시기 민중의 삶과 인권 문제 이해 : 강제 동원과 억압 속에서 살아간 조선인의 삶을 통해 독립의 필요성과 가치를 이해한다. 주요 유적지와 인물을 통한 현장 중심 학습 : 독립운동 관련 유적지와 인물을 중심으로 역사적 사건을 입체적으로 이해한다. 현대적 관점에서의 독립과 통일의 의미 탐구 : 독립운동의 정신을 바탕으로 오늘날 한반도의 상황과 통일의 의미를 함께 고찰한다.","d":"이 강좌는 한반도가 일제 식민지로 전락하게 된 역사적 배경부터 국내외에서 전개된 다양한 독립운동의 흐름을 체계적으로 탐구합니다. 동학농민운동, 3‧1운동, 대한민국 임시정부 수립 등 주요 사건을 중심으로 독립운동의 전개 과정을 살펴보고, 관련 유적지와 인물을 통해 현장감 있게 이해할 수 있도록 구성되어 있습니다. 또한 식민지 시기 민중의 삶과 인권 문제를 조명하고, 오늘날 한반도의 정세와 통일의 의미까지 확장하여 독립운동의 가치와 현대적 의미를 깊이 있게 이해할 수 있도록 합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202600062&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"안내해설실무","t":"한국의 성곽","g":["공산성","관광업/관광산업","관광콘텐츠","관광해설","국내여행","남한산성","답사","동래읍성","문화관광","문화관광해설사","문화유산","문화해설","부소산성","산성","성곽","수원화성","스토리텔링","안내해설","업무스킬","여행업","역사교육","역사유적","유적지탐방","읍성","인문학강의","전통건축","지역관광","한국문화","한국사","한국의산성","한양도성"],"h":"권기봉 (여행 작가)","r":"문화관광해설사, 관광업계 종사자","o":"한국 성곽의 역사와 유형 이해 : 한양도성, 산성, 읍성 등 다양한 성곽의 특징과 역할을 통해 한국 성곽의 전반적인 구조와 유형을 이해한다. 시대별 국방 전략과 축성 기술 분석 : 각 성곽이 만들어진 시대적 배경을 바탕으로 군사 전략과 축성 기술의 변화를 살펴본다. 주요 성곽 유적의 지리적·문화적 의미 파악 : 지역별 성곽의 입지와 환경을 통해 지리적 중요성과 문화적 가치를 이해한다. 역사적 사건과 성곽의 관계 탐구 : 임진왜란, 병인양요 등 주요 사건 속에서 성곽이 수행한 역할과 그 의미를 살펴본다. 현장 해설 및 스토리텔링 능력 강화 : 실제 유적지 해설에 활용 가능한 이야기와 포인트를 익혀 실무에 적용할 수 있는 해설 능력을 기른다.","d":"이 강좌는 한양도성을 비롯해 전국 각지의 주요 산성과 읍성을 중심으로 한국 성곽의 역사와 특징을 흥미롭게 탐구합니다. 문수산성과 갑곶돈대, 동래읍성, 남한산성 등 다양한 사례를 통해 시대별 국방 전략과 축성 기술의 변화를 살펴보고, 각 지역 성곽이 지닌 지리적·군사적 의미를 이해합니다. 또한 수원 화성, 공산성, 부소산성 등 대표 유적을 통해 성곽이 단순한 방어 시설을 넘어 정치·문화적 역할을 수행해온 과정을 조명합니다. 실제 유적지와 연계한 해설 포인트와 활용 가능한 이야기를 함께 다루어, 현장에서 바로 적용할 수 있는 실용적인 지식과 스토리텔링 능력을 기를 수 있도록 합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202600061&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"안내해설실무","t":"문화관광해설사를 위한 실전 영어회화","g ","t":"[슬가생] 언어별 바람직한 화법과 매너 (Do`s & Don`ts) [태국어]","g":["비즈니스매너","안내","안내해설","안내해설실무","태국어","해설","화법"],"h":"원고자 : 박경은 교수(한국외국어대학교 태국어과)","r":"관광통역안내사","o":"태국의 매너와 몸짓언어의 중요성을 이해할 수 있다. 태국어의 특성과 공손 화법을 이해할 수 있다. 비즈니스와 외교 통역에서 주의할 점을 이해할 수 있다. 태국 관광객의 특성을 이해할 수 있다. 한국과 태국의 문화 차이를 이해할 수 있다. 태국 관광객 안내에 주의해야 할 내용을 이해할 수 있다.","d":"태국어 관광통역안내사로서 태국의 문화적 특성에 대한 이해를 바탕으로 관광안내를 하기 위해 알아야 할 태국 문화와 예절에 따른 매너와 몸짓언어, 상하관계에 따른 화법은 무엇인지 소개 합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000176&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"안내해설실무","t":"[슬가생] 언어별 바람직한 화법과 매너 (Do`s & Don`ts) [영어]","g":["비즈니스매너","안내","안내해설","안내해설실무","영어","해설","화법"],"h":"","r":"관광통역안내사","o":"공공 연설을 이해할 수 있다. 영어권 문화의 예절을 이해할 수 있다. 비즈니스와 의전에서의 효율적인 기술을 이해할 수 있다. 미국, 영국, 호주 영어의 차이를 이해할 수 있다. 문화 규범과 비즈니스 의전을 이해할 수 있다. 한국과 미국 문화를 비교하여 이해할 수 있다. 영어를 예의 있게 표현하는 방법을 이해할 수 있다.","d":"영어 관광통역안내사로서 여행 안내 서비스를 비롯한 다양한 분야의 통역 업무를 수행하기 위해 알아야 할 영어 프리젠테이션 방법과 매너, 한국과 다른 구미권의 사고와 인식 체계, 예의 있는 고급 영어 표현은 무엇인지 소개 합니다. 원고자 : Dr. Mark A. Peterson(Frog Outside the Well Research Center)","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000175&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"안내해설실무","t":"[슬가생] 언어별 바람직한 화법과 매너 (Do`s & Don`ts) [일어]","g":["비즈니스매너","안내","안내해설","안내해설실무","일어","해설","화법"],"h":"원고자 : 김동규 교수(한국외국어대학교 일본언어문화학부)","r":"관광통역안내사","o":"일본어의 정중함, 격식 차림, 예의 바름을 이해할 수 있다. 일본어 경어에 대해 이해할 수 있다. 일본어의 금기어를 숙지하고 이를 실제 커뮤니케이션을 이해할 수 있다. 비즈니스 및 외교 통역(스피치, 회의의 장면 포함)과 같은 하이 레벨의 일본어 커뮤니케이션을 이해할 수 있다. 일본어 스피치를 이해하고 공적인 커뮤니케이션에 사용되는 항목에 대하여 이해할 수 있다.","d":"일본어 관광통역안내사로서 일본어에 대한 이해를 높여 커뮤니케이션을 원활하게 하기 위해 알아야 할 일본어 경어와 금기 표현은 무엇인지 소개 합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000174&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"안내해설실무","t":"[슬가생] 언어별 바람직한 화법과 매너 (Do`s & Don`ts) [중국어]","g":["비즈니스매너","안내","안내해설 PlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"관광지소개","t":"종묘·왕릉·고궁","g":["고궁","관광지소개","안내","안내해설","왕릉","종묘","한국문화","해설"],"h":"김영해 해설사","r":"문화관광해설사, 관광통역안내사 등에 관심있는 학습자","o":"종묘의 기능과 구조, 사상을 이해할 수 있다. 종묘제례와 종묘제례악에 대해 알 수 있다. 왕릉의 종류와 변천사에 대해 알 수 있다 능, 원, 묘의 차이를 구별할 수 있다. 제례의 의미와 순서를 이해할 수 있다. 선정릉의 구성과 기능을 이해할 수 있다. 선정릉 안내 경로와 해설방법을 익힐 수 있다. 고궁의 변천사 및 각 전각의 기능과 특징을 알 수 있다. 고궁 안내 경로와 해설 방법을 습득할 수 있다.","d":"(종묘,왕릉,고궁)종묘는 제왕을 기리는 유교사당의 표본으로서 16세기 이래로 원형이 보존되고 있으며, 세계적으로 독특한 건축양식을 지닌 의례공간입니다. 그 가치를 인정받아 1995년 세계유산으로 지정되었으며, 2008년 종묘제례와 제례악이 인류문형문화유산으로 지정되어 유무형의 세계유산을 감상할 수 있는 가치있는 공간입니다. 선정릉은 조선 9대 왕인 성종과 정현왕후, 조선 11대 왕인 중종을 모신 왕릉으로, 2009년 선정릉을 포함한 우리나라 소재 40기의 조선왕릉이 세계유산으로 지정되었습니다. 경복궁은 조선왕조의 법궁으로 1395년 태조 이성계가 창건하였습니다. 임진왜란, 일제강점기 등 파란만장한 역사를 견뎌내고 주요 전각들이 복원되어 그 위상을 되찾고 있습니다. 창덕궁은 임진왜란 이후 불타버린 경복궁을 대신하여 조선왕조의 왕들이 가장 오래 사용했던 공간입니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000074&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"안내해설실무","t":"해설 현장 기법","g":["방문객","안내","안내해설","안내해설실무","해설"],"h":"박희주(문화의 향기(관광스토리텔링전문연구소) 대표)","r":"문화관광해설사, 관광통역안내사 등에 관심있는 학습자","o":"방문객 이해와 환대 준비에 대해 배울 수 있다. 해설 전달력 향상 기법에 대해 배울 수 있다. 여유로운 해설 현장을 위한 소통 기법에 대해 배울 수 있다.","d":"실무 적용 가능한 해설 현장 기법을 습득할 수 있는 강의입니다! 자세, 시선, 리듬감 있는 해설 기법 및 여유로운 현장을 위한 다양한 소통 기법에 대해 알아봅니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000071&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0400"},{"a":"직무강좌","b":"안내/해설","s":"안내해설실무","t":"해설 시나리오 작성 기법","g":["시나리오","안내","안내해설","안내해설실무","해설"],"h":"박희주(문화의 향기(관광스토리텔링전문연구소)대표)","r":"문화관광해설사, 관광통역안내사 등에 관심있는 학습자","o":"해설 시나리오의 구조와 테마, 해설의 목표 등을 배울 수 있다. 해설 시나리오 작성과 테마 등에 대해 배울 수 있다. 해설 시나리오의 구조화에 대해 배울 수 있다.","d":"기억에 남는 해설 시나리오 작성 기법 습득하는 강의입니다! 시나리오를 끌고가는 힘, 테마를 통한 학습과 시나리오를 쓰는 중요한 포인트, 생동감 있는 현장을 위한 해설 시나리오 등에 대해 익힐 수 있습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000070&eduPlanYr=0000&eduPlan ,"d":"본 과정은 패키지 수료증 과정으로 본 과정 외 5개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 2025년 국내여행 트렌드는 세대별 여행 성향의 뚜렷한 차이를 중심으로 변화하고 있습니다. 시니어 세대는 은퇴 이후의 삶에서 배움과 건강, 사회적 교류를 중시하며 안정성과 신뢰 기반의 체험형 여행을 선호합니다. 반면 MZ세대는 개인의 관심사에 기반한 초개인화 여행과 기록 및 공유 중심의 여행 패턴을 보이며, 여행을 통해 자아를 표현하고 라이프스타일을 실현하려는 경향이 강합니다. 본 강좌는 시니어와 MZ세대 각각의 여행 트렌드를 이해하고, 여행업계가 이에 어떻게 대응해야 하는지를 제시합니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500501&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0500"},{"a":"직무강좌","b":"여행","s":"전략/기획","t":"여행·관광스타트업의 도전 전략","g":["관광스타트업","관광업/관광산업","관광인프라","관광창업","관광콘텐츠","글로벌진출","기획","디지털관광","디지털기술","스타트업도전과제","여행","여행·관광업","전략","지속가능관광"],"h":"임형택(선문대학교 글로벌관광학부 교수)","r":"관광 분야 창업에 관심 있는 예비·기존 창업자","o":"관광 스타트업이 직면한 주요 도전과제를 이해한다. 시장 진입·성장 단계별 성공 전략과 유의점을 파악한다. 글로벌 진출을 위한 기술, 협업, 지속 가능성 전략을 수립한다.","d":"본 과정은 패키지 수료증 과정으로 본 과정 외 4개의 과정을 수료해야 수료증을 발급 받을 수 있습니다. 하단 패키지 과정 정보를 확인해 주시기 바랍니다. 패키지과정이란? 여행·관광 스타트업이 마주한 현실적 도전과 이를 극복하기 위한 전략을 살펴봅니다. 높은 시장 진입 장벽, 불안정한 수익 구조, 규제와 자본의 한계를 짚으며, 차별화된 아이디어와 기술 융합, 지속 가능성, 파트너십 구축을 통해 성공적으로 시장에 안착하는 방법을 구체적인 사례와 함께 제시합니다. 이를 통해 관광 스타트업이 국내를 넘어 글로벌 시장으로 성장하기 위한 핵심 전략과 실행 방향을 함께 모색합니다. [투어리즘 커리어 마일리지 특별수료증 발급 안내] * TCM(투어리즘 커리어 마일리지)란? 관광일자리센터 취업 프로그램 및 관광e-배움터 직무별 패키지 과정 수료자 대상 특별 수료증을 제공하는 과정입니다. 발급대상 : 본 패키지 과정 수강 완료 후, 관광일자리센터 취업프로그램을 일정 기준 이상 수료한 교육생 혜택 : 기준 충족 시 한국관광공사 사장 명의의 특별수료증 추가 발급, 관광인 구인등록 기업 우선 추천, 관광일자리센터 프로그램 참여 기회 우선 제공, 우수 참여자 대상 시상 세부내용 : 이벤트 페이지 참조 (하이퍼링크)","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C202500499&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0500"},{"a":"직무강좌","b":"여행","s":"전략/기획","t":"K-POP 팬을 여행자로 만든 스타트업 이야기","g":["K-POP","K-POP관광","관광비즈니스","관광스타트업","관광업/관광산업","관광인프라","관광창업","관광콘텐츠","기획","여행","여행·관광업","인바운드","전략","창업","창업스토리","팬덤마케팅"],"h":"이종석(앰프 대표)","r":"관광 분야 창업에 관심 있는 예비·기존 창업자","o":"K-POP 관광의 최신 트렌드와 팬덤 기반 수요 전환 구조를 이해한다. 팬덤 플랫폼·SNS 정보를 활용해 상품화 가능한 콘텐츠를 발굴·기획한다. K-POP 팬덤 문화를 기반으로 한 새로운 관광 비즈니스 모델과 확장 전략을 모색한다.","d edu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000139&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0500"},{"a":"직무강좌","b":"여행","s":"전략/기획","t":"데이터 활용 인사이트","g":["기획","데이터","디지털활용","빅데이터","여행","전략","트렌드"],"h":"","r":"1. 관광빅데이터의 인사이트를 얻고자 싶은 학습자 2. 관광산업에 종사하고 있는 학습자","o":"데이터 분석을, 어떻게 시작할 수 있는지 알 수 있다. 명확한 목표설정을 통해 데이터 분석결과를 도출한다. 관광산업에서 데이터를 어떻게 활용할 수 있을지 인사이트를 얻을 수 있다. 다른 산업에서 데이터를 어떻게 활용하는지를 알아보고 관광산업에 적용할 수 있다.","d":"본 과정에서는 데이터에 대해 이해하고 타 산업 및 관광산업 분야에서 어떻게 데이터를 활용하고 있는지에 대해 학습하고 인사이트를 얻고자 하는 과정입니다. 빅데이터 시대의 도래로 이제는 사업 전분야에 걸쳐 데이터가 중요한 시대가 왔습니다! 관광 산업의 빅데이터 시대에 대해 알아볼 수 있습니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000117&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0500"},{"a":"직무강좌","b":"여행","s":"전략/기획","t":"관광빅데이터 활용","g":["기획","디지털활용","빅데이터","스마트관광","여행","전략","트렌드"],"h":"1. 정남호(경희대학교 교수) 2. 이동욱(SKT부장) 3. 김준호(신한카드 Databiz팀 부장)","r":"1. 관광빅데이터의 전반적인 분석 및 활용 방법을 배우고 싶은 학습자 2. 관광 산업에 종사하고 있는 학습자","o":"빅데이터에 분석기법 및 적용 방법을 알 수 있다. 스마트관광 빅데이터의 유형 및 활용 방안을 알 수 있다. 관광빅데이터의 활용 사례를 알 수 있다.","d":"본 과정은 관광 빅데이터에 대해서 이해하고, 관광빅데이터 분석 및 사례를 통해 관광 비즈니스 현장에 접목시키는 방안에 대해서 알아봅니다. 빅데이터 시대에 경쟁의 승부는 누가 더 많은 데이터를 갖고있고 누가 그것을 잘 활용하는지에 달려있습니다. 이제는 익숙하게 느껴지는 ‘4차 산업혁명’ 키워드와 마찬가지로 ‘빅데이터’ 역시 다양한 분야에서 활용되고 있으며, 관광 산업 역시 빅데이터는 중요한 비즈니스의 영역입니다.","u":"https://touredu.visitkorea.or.kr/home/courseEdu/courseEduDetail?crsCd=C190000089&eduPlanYr=0000&eduPlanYrStepCnt=0&crsDtlRelmCd=J0500"},{"a":"직무강좌","b":"여행","s":"마케팅/홍보/세일즈","t":"관광분야 소셜미디어 마케팅","g":["고객경험","디지털활용","마케팅","세일즈","소셜미디어","여행","홍보"],"h":"1. 이승윤(건국대학교 경영학과 부교수) 2. 정란수(한양대학교 겸임교수)","r":"1. 소셜미디어 마케팅에 관심이 있는 학습자 2. 관광 산업에 종사하는 학습자","o":"DIGITAL TRANSFORMATION 시대, 혁신적인 고객 경험 전략을 알 수 있다. DIGITAL TRANSFORMATION 시대, ONLINE TO OFFLINE 전략을 알 수 있다. 관광분야 소셜미디어 마케팅의 개념과 주요 활용 방안을 알 수 있다. 관광분야 소셜미디어 마케팅이 사례분석을 통해 실제 적용 방안을 알 수 있다.","d":"본 과정에서는 관광 분야의 소셜미디어 마케팅이 왜 중요한지를 알아보고 관광 소셜미디어 마케팅에 대한 개념과 주요 활용에 대해서 알아봅니다. 그리고 관광분야 소셜미디어 사례분석을 통해 실제 적용 방안에 대해서 알아봅니다. DIGITAL TRANSFORMATION 시대, }

      '<div class="barrow-track"><div class="barrow-fill" style="width:' + Math.round(n / max * 100) + '%"></div></div>' +
      '<div class="barrow-value">' + n.toLocaleString() + '</div>' +

  ).join('');
}

renderBarList('chartMinor', DASHBOARD.byMinorArr);
renderBarList('chartSubType', DASHBOARD.bySubTypeArr);
renderBarList('chartTags', DASHBOARD.topTagsForChart.map(([t, n]) => ['#' + t, n]));

const shareBtn = document.getElementById('shareBtn');
const shareFallback = document.getElementById('shareFallback');
shareBtn.addEventListener('click', async () => {
  const url = 'https://claude.ai/code/artifact/416ab0d5-d2c8-4c9a-9ab6-75e331859a56';
  let copied = false;
  try {
    await navigator.clipboard.writeText(url);
    copied = true;
  } catch (e) {
    try {
      shareFallback.style.display = 'inline-block';
      shareFallback.value = url;
      shareFallback.focus();
      shareFallback.select();
      copied = document.execCommand('copy');
    } catch (e2) { copied = false; }
  }
  const original = shareBtn.textContent;
  shareBtn.textContent = copied ? '✓ 링크 복사됨' : '복사 실패 — 아래에서 직접 복사';
  if (!copied) {
    shareFallback.style.display = 'inline-block';
    shareFallback.value = url;
    shareFallback.focus();
    shareFallback.select();
  }
  setTimeout(() => { shareBtn.textContent = original; }, 2000);
});

function setSummaryOpen(open) {
  summaryPanel.classList.toggle('open', open);
  summaryBtn.classList.toggle('active', open);
  summaryBtn.textContent = open ? '요약 닫기' : '요약 보기';
  localStorage.setItem('touredu_summary', open ? '1' : '0');
}
setSummaryOpen(localStorage.getItem('touredu_summary') === '1');
summaryBtn.addEventListener('click', () => setSummaryOpen(!summaryPanel.classList.contains('open')));

const el = {
  list: document.getElementById('list'),
  empty: document.getElementById('empty'),
  search: document.getElementById('search'),
  fMajor: document.getElementById('fMajor'),
  fMinor: document.getElementById('fMinor'),
  fSub: document.getElementById('fSub'),
  tagbar: document.getElementById('tagbar'),
  resultCount: document.getElementById('resultCount'),
};

let activeTag = '';

DATA.forEach((c, i) => { c._id = i; c._hay = [c.t, c.g.join(' '), c.d, c.h, c.r, c.o].join(' ').toLowerCase(); });

function uniqueSorted(arr) { return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko')); }

function fillSelect(sel, values, placeholder) {
  sel.innerHTML = '<option value="">' + placeholder + '</option>' +
    values.map(v => '<option value="' + v.replace(/"/g,'&quot;') + '">' + v + '</option>').join('');
}
fillSelect(el.fMajor, uniqueSorted(DATA.map(c => c.a)), '대분류 전체');

function updateMinorOptions() {
  const major = el.fMajor.value;
  const pool = major ? DATA.filter(c => c.a === major) : DATA;
  fillSelect(el.fMinor, uniqueSorted(pool.map(c => c.b)), '중분류 전체');
  el.fMinor.value = '';
  updateSubOptions();
}
function updateSubOptions() {
  const major = el.fMajor.value, minor = el.fMinor.value;
  let pool = DATA;
  if (major) pool = pool.filter(c => c.a === major);
  if (minor) pool = pool.filter(c => c.b === minor);
  fillSelect(el.fSub, uniqueSorted(pool.map(c => c.s)), '구분 전체');
  el.fSub.value = '';
}
updateMinorOptions();

el.tagbar.innerHTML += TOP_TAGS.map(t =>
  '<button type="button" class="tagchip" data-tag="' + t.replace(/"/g,'&quot;') + '">#' + t + '</button>'
).join('');
el.tagbar.addEventListener('click', (e) => {
  const btn = e.target.closest('.tagchip');
  if (!btn) return;
  const t = btn.dataset.tag;
  activeTag = activeTag === t ? '' : t;
  el.tagbar.querySelectorAll('.tagchip').forEach(b => b.classList.toggle('active', b.dataset.tag === activeTag));
  render();
});

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render() {
  const q = el.search.value.trim().toLowerCase();
  const major = el.fMajor.value, minor = el.fMinor.value, sub = el.fSub.value;

  const filtered = DATA.filter(c => {
    if (major && c.a !== major) return false;
    if (minor && c.b !== minor) return false;
    if (sub && c.s !== sub) return false;
    if (activeTag && !c.g.includes(activeTag)) return false;
    if (q && !c._hay.includes(q)) return false;
    return true;
  });

  el.resultCount.innerHTML = '<b>' + filtered.length.toLocaleString() + '</b>건 표시 중';
  el.empty.style.display = filtered.length ? 'none' : 'block';

  const openIds = new Set([...el.list.querySelectorAll('.row.open')].map(r => r.dataset.id));

  el.list.innerHTML = filtered.slice(0, 2000).map(c => {
    const tagsPreview = c.g.slice(0, 6).map(t => '#' + t).join(' ') + (c.g.length > 6 ? ' 외 ' + (c.g.length - 6) + '개' : '');
    const isOpen = openIds.has(String(c._id));
    return '<div class="row' + (isOpen ? ' open' : '') + '" data-id="' + c._id + '">' +
      '<div class="row-head">' +
        '<span class="chip ' + c.a + '">' + c.a + '</span>' +
        '<span class="row-minor">' + escapeHtml(c.b) + '</span>' +
        (c.s ? '<span class="row-sub">' + escapeHtml(c.s) + '</span>' : '') +
      '</div>' +
      '<div class="row-title">' + escapeHtml(c.t) + '</div>' +
      (c.g.length ? '<div class="row-tags">' + escapeHtml(tagsPreview) + '</div>' : '') +
      '<div class="row-detail">' +
        (c.d ? '<div class="f"><div class="k">강좌설명</div><div class="v">' + escapeHtml(c.d) + '</div></div>' : '') +
        (c.o ? '<div class="f"><div class="k">강좌목표</div><div class="v">' + escapeHtml(c.o) + '</div></div>' : '') +
        (c.r ? '<div class="f"><div class="k">교육대상</div><div class="v">' + escapeHtml(c.r) + '</div></div>' : '') +
        (c.h ? '<div class="f"><div class="k">강사소개</div><div class="v">' + escapeHtml(c.h) + '</div></div>' : '') +
        '<div class="f"><div class="k">태그</div><div class="v">' + escapeHtml(c.g.map(t=>'#'+t).join(' ')) + '</div></div>' +
        '<div class="f"><div class="k">URL</div><div class="v"><a href="' + c.u + '" target="_blank" rel="noopener">' + c.u + '</a></div></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

el.list.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row || e.target.tagName === 'A') return;
  row.classList.toggle('open');
});

el.search.addEventListener('input', render);
el.fMajor.addEventListener('change', () => { updateMinorOptions(); render(); });
el.fMinor.addEventListener('change', () => { updateSubOptions(); render(); });
el.fSub.addEventListener('change', render);

render();
</script>
